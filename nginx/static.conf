server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Cache static assets aggressively (30 days for hashed assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # HTML pages - no cache for fresh content to crawlers
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Sitemap and robots.txt - short cache
    location ~* (sitemap\.xml|robots\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }


    # Consolidated/renamed page redirects — mirrors vercel.json's `redirects`
    # array, which only applies to Vercel preview builds; production (this
    # config) never read it, so these were silently 404ing instead of
    # redirecting despite already being defined there.
    location = /gaas { return 301 https://zunkireelabs.com/agentic-as-a-service/; }
    location = /gaas/ { return 301 https://zunkireelabs.com/agentic-as-a-service/; }
    location = /resources/gaas-guide { return 301 https://zunkireelabs.com/resources/what-is-gaas/; }
    location = /resources/gaas-guide/ { return 301 https://zunkireelabs.com/resources/what-is-gaas/; }
    location = /resources/gaas-vs-saas { return 301 https://zunkireelabs.com/resources/what-is-gaas/#gaas-vs-saas; }
    location = /resources/gaas-vs-saas/ { return 301 https://zunkireelabs.com/resources/what-is-gaas/#gaas-vs-saas; }
    location = /blog/top-ai-companies-paving-the-way-in-nepal { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/top-ai-companies-paving-the-way-in-nepal/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/finding-the-top-ai-companies-in-nepal-a-comprehensive-guide { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/finding-the-top-ai-companies-in-nepal-a-comprehensive-guide/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/exploring-the-top-ai-companies-in-nepal-a-comprehensive-list { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/exploring-the-top-ai-companies-in-nepal-a-comprehensive-list/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/top-ai-companies-in-kathmandu-innovating-the-future { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/top-ai-companies-in-kathmandu-innovating-the-future/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/leading-ai-companies-in-nepal-a-guide-to-zunkiree-labs-and-others { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/leading-ai-companies-in-nepal-a-guide-to-zunkiree-labs-and-others/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/top-ai-companies-to-watch-in-nepal { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/top-ai-companies-to-watch-in-nepal/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/exploring-the-top-ai-companies-nepal-a-comprehensive-list { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }
    location = /blog/exploring-the-top-ai-companies-nepal-a-comprehensive-list/ { return 301 https://zunkireelabs.com/blog/top-ai-companies-nepal-2026/; }

    # Legacy /locations//<service>/ URLs (empty city slug — a past template
    # bug, already fixed upstream, but Google still has these crawled). No
    # city info survives in the URL to redirect to a real location page, so
    # these go to the matching general /services/<slug>/ page instead. Both
    # the literal double-slash form and nginx's merge_slashes-collapsed
    # single-slash form are exact matches, so neither can collide with a
    # real single-segment city page like /locations/pokhara/.
    location = /locations//ai-customer-experience/ { return 301 https://zunkireelabs.com/services/ai-customer-experience/; }
    location = /locations/ai-customer-experience/ { return 301 https://zunkireelabs.com/services/ai-customer-experience/; }
    location = /locations//ai-development/ { return 301 https://zunkireelabs.com/services/ai-development/; }
    location = /locations/ai-development/ { return 301 https://zunkireelabs.com/services/ai-development/; }
    location = /locations//custom-software/ { return 301 https://zunkireelabs.com/services/custom-software/; }
    location = /locations/custom-software/ { return 301 https://zunkireelabs.com/services/custom-software/; }
    location = /locations//ai-ecommerce/ { return 301 https://zunkireelabs.com/services/ai-ecommerce/; }
    location = /locations/ai-ecommerce/ { return 301 https://zunkireelabs.com/services/ai-ecommerce/; }
    location = /locations//saas-development/ { return 301 https://zunkireelabs.com/services/saas-development/; }
    location = /locations/saas-development/ { return 301 https://zunkireelabs.com/services/saas-development/; }
    location = /locations//web-development/ { return 301 https://zunkireelabs.com/services/web-development/; }
    location = /locations/web-development/ { return 301 https://zunkireelabs.com/services/web-development/; }
    location = /locations//data-systems/ { return 301 https://zunkireelabs.com/services/data-systems/; }
    location = /locations/data-systems/ { return 301 https://zunkireelabs.com/services/data-systems/; }
    location = /locations//app-development/ { return 301 https://zunkireelabs.com/services/app-development/; }
    location = /locations/app-development/ { return 301 https://zunkireelabs.com/services/app-development/; }
    location = /locations//aeo-seo/ { return 301 https://zunkireelabs.com/services/aeo-seo/; }
    location = /locations/aeo-seo/ { return 301 https://zunkireelabs.com/services/aeo-seo/; }

    # Dead case-study pages with no live search value — redirected to the
    # resources index rather than left as bare 404s, so any residual link
    # equity/crawl attention consolidates there instead of dead-ending.
    location = /resources/rapid-investment-case-study/ { return 301 https://zunkireelabs.com/resources/; }
    location = /resources/rapid-investment-case-study { return 301 https://zunkireelabs.com/resources/; }
    location = /resources/cms-group-case-study/ { return 301 https://zunkireelabs.com/resources/; }
    location = /resources/cms-group-case-study { return 301 https://zunkireelabs.com/resources/; }

    # Eleventy static routing
    location / {
        try_files $uri $uri/ $uri.html =404;

        # Default to no-cache for HTML routes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    # SEOAI:SECURITY-HEADERS:START
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; report-uri /csp-report" always;
# SEOAI:SECURITY-HEADERS:END
}
