server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Cache static assets aggressively (30 days for hashed assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
        # Repeated here on purpose: a location that sets its own add_header does
        # NOT inherit the server-level ones (SEOAI:SECURITY-HEADERS block below).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # HTML pages - no cache for fresh content to crawlers
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        # Repeated here on purpose: a location that sets its own add_header does
        # NOT inherit the server-level ones (SEOAI:SECURITY-HEADERS block below).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Sitemap and robots.txt - short cache
    location ~* (sitemap\.xml|robots\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # Repeated here on purpose: a location that sets its own add_header does
        # NOT inherit the server-level ones (SEOAI:SECURITY-HEADERS block below).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }


    # ----- Services -> Solutions section rename -----------------------------
    # The nine service lines moved from /services/* to /solutions/* across all
    # four locales. Enumerated rather than a regex rewrite because
    # scripts/check-i18n.mjs parses `location = ... return 301` pairs to prove
    # nginx and vercel.json agree — a rewrite rule is invisible to that guard
    # and would silently look like a production 404. The three solution pages
    # added alongside this rename never lived under /services/, so they need no
    # entry here. Destinations carry the trailing slash so nothing takes 2 hops.
