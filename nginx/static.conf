    # Lead-form submission proxy — this container is a plain static file
    # server with no Node runtime, so contact.njk/get-a-quote.njk/apply.njk's
    # client-side fetch to /api/submit-lead is forwarded to the Node sidecar
    # container instead (server/submit-lead-server.js, added as docker-
    # compose.yml's `api` service on the shared `internal` Docker network).
    # A literal `proxy_pass http://api:3001` resolves "api" at nginx startup
    # (config-load time) — if the api container isn't DNS-registered yet at
    # that moment, nginx fails to start at all ("host not found in upstream"),
    # a real startup-order race despite `depends_on`. Docker's embedded DNS
    # (127.0.0.11) + a variable in proxy_pass defers resolution to
    # request-time instead, the standard fix for this in Docker Compose.
    #
    # proxy_pass has NO uri part here (deliberately) — confirmed real bug
    # 2026-09-29, reproduced locally against a real nginx + a fake upstream:
    # once proxy_pass's target contains a variable (required above for the
    # Docker-DNS fix), nginx no longer replaces the matched location prefix
    # with the request's own remaining path — it forwards ONLY the literal
    # URI text written after the variable, dropping the actual request path
    # entirely. `proxy_pass http://$api_upstream/api/;` sent the upstream a
    # flat, unconditional "/api/" for every single request under this
    # location — /api/submit-lead, /api/health, anything — which never
    # matched submit-lead-server.js's exact pathname checks and 404'd every
    # time. Passing no URI here forwards the original request path (e.g.
    # /api/submit-lead) to the upstream completely unchanged instead.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream "api:3001";
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eleventy static routing
    location / {
        try_files $uri $uri/ $uri.html =404;

        # Default to no-cache for HTML routes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
