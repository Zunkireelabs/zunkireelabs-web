name: Deploy to Staging

on:
  push:
    branches: [stage]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/zunkireelabs/devprojects/zunkiree-web-staging
            git pull origin stage
            # Written fresh each deploy, never committed — read by docker
            # compose for the `api` sidecar's EDGEX_CRM_TOKEN substitution
            # (docker-compose.dev.yml). See server/submit-lead-server.js.
            echo "EDGEX_CRM_TOKEN=${{ secrets.EDGEX_CRM_TOKEN }}" > .env
            # Full down/up so the container re-attaches to the external `hosting`
            # network and Traefik re-registers the router. A bare `up -d --build`
            # on an existing container can leave a stale network attachment,
            # which makes Traefik 404 the host even while the container is healthy.
            docker compose -f docker-compose.dev.yml down --remove-orphans
            docker compose -f docker-compose.dev.yml up -d --build --force-recreate
            echo "Waiting for containers to be healthy..."
            sleep 10
            for i in $(seq 1 12); do
              APP_STATUS=$(docker inspect --format='{{.State.Health.Status}}' zunkiree-staging 2>/dev/null || echo "unknown")
              API_STATUS=$(docker inspect --format='{{.State.Health.Status}}' zunkiree-staging-api 2>/dev/null || echo "unknown")
              if [ "$APP_STATUS" = "healthy" ] && [ "$API_STATUS" = "healthy" ]; then
                echo "Containers are healthy!"
                exit 0
              fi
              echo "Attempt $i/12: app=$APP_STATUS api=$API_STATUS, waiting..."
              sleep 10
            done
            echo "Containers did not become healthy within 2 minutes"
            docker logs zunkiree-staging --tail 50
            docker logs zunkiree-staging-api --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://dev-web.zunkireelabs.com)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Staging health check passed (HTTP $HTTP_CODE)"
          else
            echo "Staging health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://dev-web.zunkireelabs.com/api/submit-lead -H "Content-Type: application/json" -d '{}')
          if [ "$API_CODE" = "404" ]; then
            echo "Lead-form proxy check failed: /api/submit-lead returned 404 (route not reachable)"
            exit 1
          else
            echo "Lead-form proxy check passed (HTTP $API_CODE, route reachable)"
          fi
