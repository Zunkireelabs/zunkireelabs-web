name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/zunkireelabs/devprojects/zunkiree-web-prod
            git pull origin main
            # Written fresh each deploy, never committed — read by docker
            # compose for the `api` sidecar's EDGEX_CRM_TOKEN substitution
            # (docker-compose.yml). See server/submit-lead-server.js.
            echo "EDGEX_CRM_TOKEN=${{ secrets.EDGEX_CRM_TOKEN }}" > .env
            docker compose up -d --build
            echo "Waiting for containers to be healthy..."
            sleep 10
            for i in $(seq 1 12); do
              APP_STATUS=$(docker inspect --format='{{.State.Health.Status}}' zunkiree-production 2>/dev/null || echo "unknown")
              API_STATUS=$(docker inspect --format='{{.State.Health.Status}}' zunkiree-production-api 2>/dev/null || echo "unknown")
              if [ "$APP_STATUS" = "healthy" ] && [ "$API_STATUS" = "healthy" ]; then
                echo "Containers are healthy!"
                exit 0
              fi
              echo "Attempt $i/12: app=$APP_STATUS api=$API_STATUS, waiting..."
              sleep 10
            done
            echo "Containers did not become healthy within 2 minutes"
            docker logs zunkiree-production --tail 50
            docker logs zunkiree-production-api --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://zunkireelabs.com)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed (HTTP $HTTP_CODE)"
          else
            echo "Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Confirms the lead-form proxy is actually reachable through nginx
          # (not a 404, which is exactly how this class of failure shipped
          # silently before — see server/submit-lead-server.js). A malformed
          # empty body is expected to reach the CRM and get a 4xx from IT,
          # not from nginx/this proxy — anything other than a 404 here means
          # the route exists, which is all this check needs to confirm.
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://zunkireelabs.com/api/submit-lead -H "Content-Type: application/json" -d '{}')
          if [ "$API_CODE" = "404" ]; then
            echo "Lead-form proxy check failed: /api/submit-lead returned 404 (route not reachable)"
            exit 1
          else
            echo "Lead-form proxy check passed (HTTP $API_CODE, route reachable)"
          fi
