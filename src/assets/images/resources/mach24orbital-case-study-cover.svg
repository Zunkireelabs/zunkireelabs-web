<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="mach24-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1033"/>
    </linearGradient>
    <linearGradient id="mach24-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#mach24-bg)"/>

  <!-- Star field + orbit motif -->
  <g fill="#fff" opacity="0.15">
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="200" cy="40" r="1"/>
    <circle cx="300" cy="80" r="1.5"/>
    <circle cx="500" cy="50" r="1"/>
    <circle cx="600" cy="90" r="1.5"/>
    <circle cx="700" cy="60" r="1"/>
    <circle cx="150" cy="150" r="1"/>
    <circle cx="650" cy="180" r="1.5"/>
  </g>
  <g stroke="#fff" stroke-width="2" fill="none" opacity="0.08">
    <ellipse cx="640" cy="200" rx="140" ry="55" transform="rotate(-20 640 200)"/>
  </g>

  <!-- Primary stat -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#fff" opacity="0.7">LAUNCH PREPARATION</text>
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#mach24-accent)">50%</text>
    <text x="4" y="120" font-family="system-ui, sans-serif" font-size="16" fill="#fff" opacity="0.85">Faster</text>
  </g>

  <!-- Secondary outcomes -->
  <g transform="translate(80, 280)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Optimized satellite deployment scheduling</text>
  </g>
  <g transform="translate(80, 334)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Fewer manual coordination steps pre-launch</text>
  </g>

  <!-- Company name -->
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" opacity="0.9">MACH24 ORBITAL</text>

  <!-- Case study badge -->
  <rect x="620" y="390" width="120" height="35" fill="url(#mach24-accent)" rx="4"/>
  <text x="680" y="413" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e1033" text-anchor="middle">CASE STUDY</text>
</svg>
