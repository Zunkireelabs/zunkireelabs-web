<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="khems-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="khems-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#khems-bg)"/>

  <!-- Calendar/booking motif -->
  <g fill="#fff" opacity="0.06">
    <rect x="560" y="70" width="180" height="200" rx="8"/>
  </g>
  <g stroke="#fff" stroke-width="2" opacity="0.1">
    <line x1="560" y1="110" x2="740" y2="110"/>
    <line x1="600" y1="70" x2="600" y2="110"/>
    <line x1="700" y1="70" x2="700" y2="110"/>
  </g>

  <!-- Primary stat -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#fff" opacity="0.7">BOOKINGS</text>
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#khems-accent)">70%</text>
    <text x="4" y="120" font-family="system-ui, sans-serif" font-size="16" fill="#fff" opacity="0.85">Increase in bookings</text>
  </g>

  <!-- Secondary outcomes -->
  <g transform="translate(80, 280)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Higher service capacity without adding staff</text>
  </g>
  <g transform="translate(80, 334)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Improved customer satisfaction scores</text>
  </g>

  <!-- Company name -->
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" opacity="0.9">KHEMS CLEANING</text>

  <!-- Case study badge -->
  <rect x="620" y="390" width="120" height="35" fill="url(#khems-accent)" rx="4"/>
  <text x="680" y="413" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#451a03" text-anchor="middle">CASE STUDY</text>
</svg>
