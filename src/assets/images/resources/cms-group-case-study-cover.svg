<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="cms-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cms-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cms-bg)"/>

  <!-- Document/workflow motif -->
  <g fill="#fff" opacity="0.06">
    <rect x="560" y="60" width="140" height="180" rx="6"/>
    <rect x="600" y="120" width="140" height="180" rx="6"/>
    <rect x="640" y="180" width="140" height="180" rx="6"/>
  </g>

  <!-- Primary stat -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#fff" opacity="0.7">DOCUMENT WORKFLOWS</text>
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#cms-accent)">85%</text>
    <text x="4" y="120" font-family="system-ui, sans-serif" font-size="16" fill="#fff" opacity="0.85">Automated</text>
  </g>

  <!-- Secondary outcomes -->
  <g transform="translate(80, 280)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Fewer manual handoffs across teams</text>
  </g>
  <g transform="translate(80, 334)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Strategic work capacity freed up for staff</text>
  </g>

  <!-- Company name -->
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" opacity="0.9">CMS GROUP</text>

  <!-- Case study badge -->
  <rect x="620" y="390" width="120" height="35" fill="url(#cms-accent)" rx="4"/>
  <text x="680" y="413" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">CASE STUDY</text>
</svg>
