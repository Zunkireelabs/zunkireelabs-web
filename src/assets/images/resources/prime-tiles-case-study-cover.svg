<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="prime-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#4a0d29"/>
    </linearGradient>
    <linearGradient id="prime-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#prime-bg)"/>

  <!-- Tile grid motif -->
  <g fill="#fff" opacity="0.06">
    <rect x="560" y="60" width="60" height="60"/>
    <rect x="630" y="60" width="60" height="60"/>
    <rect x="700" y="60" width="60" height="60"/>
    <rect x="560" y="130" width="60" height="60"/>
    <rect x="630" y="130" width="60" height="60"/>
    <rect x="700" y="130" width="60" height="60"/>
    <rect x="560" y="200" width="60" height="60"/>
    <rect x="630" y="200" width="60" height="60"/>
    <rect x="700" y="200" width="60" height="60"/>
  </g>

  <!-- Primary stat -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#fff" opacity="0.7">ONLINE CONVERSION</text>
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#prime-accent)">2x</text>
    <text x="4" y="120" font-family="system-ui, sans-serif" font-size="16" fill="#fff" opacity="0.85">Higher conversion rate</text>
  </g>

  <!-- Secondary outcomes -->
  <g transform="translate(80, 280)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Faster product discovery for customers</text>
  </g>
  <g transform="translate(80, 334)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Fewer abandoned searches on-site</text>
  </g>

  <!-- Company name -->
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" opacity="0.9">PRIME TILES</text>

  <!-- Case study badge -->
  <rect x="620" y="390" width="120" height="35" fill="url(#prime-accent)" rx="4"/>
  <text x="680" y="413" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4a0d29" text-anchor="middle">CASE STUDY</text>
</svg>
