<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="zenly-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="zenly-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#zenly-bg)"/>

  <!-- Abstract calendar icon -->
  <g transform="translate(560, 70)" opacity="0.12">
    <rect x="0" y="20" width="180" height="150" rx="10" fill="none" stroke="#fff" stroke-width="8"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#fff" stroke-width="8"/>
    <line x1="40" y1="0" x2="40" y2="40" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="0" x2="140" y2="40" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Availability grid visualization -->
  <g transform="translate(80, 100)">
    <g transform="translate(0, 0)">
      <rect width="300" height="45" fill="#fff" opacity="0.15" rx="8"/>
      <circle cx="28" cy="22" r="12" fill="#fff" opacity="0.3"/>
      <rect x="48" y="12" width="180" height="8" fill="#fff" opacity="0.4" rx="4"/>
      <rect x="48" y="26" width="140" height="6" fill="#fff" opacity="0.3" rx="3"/>
    </g>

    <g transform="translate(90, 65)">
      <rect width="300" height="70" fill="url(#zenly-accent)" opacity="0.2" rx="8"/>
      <circle cx="30" cy="35" r="15" fill="url(#zenly-accent)"/>
      <text x="30" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#083344" text-anchor="middle">AI</text>
      <rect x="55" y="20" width="210" height="8" fill="#fff" opacity="0.6" rx="4"/>
      <rect x="55" y="35" width="170" height="6" fill="#fff" opacity="0.4" rx="3"/>
      <rect x="55" y="48" width="190" height="6" fill="#fff" opacity="0.4" rx="3"/>
    </g>

    <g transform="translate(0, 155)">
      <rect x="0" width="60" height="45" fill="#fff" opacity="0.15" rx="6"/>
      <rect x="68" width="60" height="45" fill="url(#zenly-accent)" opacity="0.3" rx="6"/>
      <rect x="136" width="60" height="45" fill="#fff" opacity="0.15" rx="6"/>
      <rect x="204" width="60" height="45" fill="#fff" opacity="0.15" rx="6"/>
    </g>
  </g>

  <!-- Capability chips -->
  <g transform="translate(500, 210)">
    <rect width="220" height="42" fill="#fff" opacity="0.1" rx="8"/>
    <text x="110" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">AUTO CONFLICT RESOLUTION</text>

    <g transform="translate(0, 52)">
      <rect width="220" height="42" fill="#fff" opacity="0.1" rx="8"/>
      <text x="110" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">MULTI-RESOURCE BOOKING</text>
    </g>
  </g>

  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#fff">ZENLY</text>
  <text x="80" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#fff" opacity="0.7">AI Booking Engine</text>

  <rect x="620" y="370" width="120" height="35" fill="url(#zenly-accent)" rx="4"/>
  <text x="680" y="393" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#083344" text-anchor="middle">CASE STUDY</text>
</svg>
