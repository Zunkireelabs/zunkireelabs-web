<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="chayce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="chayce-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#chayce-bg)"/>

  <!-- Property/skyline motif -->
  <g fill="#fff" opacity="0.06">
    <rect x="560" y="180" width="70" height="220"/>
    <rect x="640" y="120" width="70" height="280"/>
    <rect x="720" y="220" width="40" height="180"/>
  </g>
  <g stroke="#fff" stroke-width="1.5" opacity="0.08">
    <line x1="575" y1="200" x2="615" y2="200"/>
    <line x1="575" y1="230" x2="615" y2="230"/>
    <line x1="655" y1="150" x2="695" y2="150"/>
    <line x1="655" y1="185" x2="695" y2="185"/>
  </g>

  <!-- No single numeric result was reported for this engagement — headline
       treatment uses the real, qualitative outcome instead of inventing a stat. -->
  <g transform="translate(80, 150)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#fff" opacity="0.7">ENGAGEMENT</text>
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#chayce-accent)">Website, AI &amp; Technical</text>
    <text x="0" y="82" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#chayce-accent)">Delivery — One Partner</text>
  </g>

  <!-- Secondary outcomes -->
  <g transform="translate(80, 280)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Ongoing technical delivery, not a one-off engagement</text>
  </g>
  <g transform="translate(80, 334)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Single point of accountability across every system</text>
  </g>

  <!-- Company name -->
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" opacity="0.9">CHAYCE PROPERTIES</text>

  <!-- Case study badge -->
  <rect x="620" y="390" width="120" height="35" fill="url(#chayce-accent)" rx="4"/>
  <text x="680" y="413" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e1b4b" text-anchor="middle">CASE STUDY</text>
</svg>
