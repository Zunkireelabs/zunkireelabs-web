<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="rapid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="rapid-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#rapid-bg)"/>

  <!-- Chart-line motif -->
  <g stroke="#fff" stroke-width="3" fill="none" opacity="0.08">
    <polyline points="60,380 180,320 300,340 420,240 540,260 660,140 740,110"/>
  </g>
  <g fill="#fff" opacity="0.05">
    <circle cx="180" cy="320" r="6"/>
    <circle cx="420" cy="240" r="6"/>
    <circle cx="660" cy="140" r="6"/>
  </g>

  <!-- Primary stat -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#fff" opacity="0.7">DEAL ANALYSIS SPEED</text>
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#rapid-accent)">10x</text>
    <text x="4" y="120" font-family="system-ui, sans-serif" font-size="16" fill="#fff" opacity="0.85">Faster deal analysis</text>
  </g>

  <!-- Secondary outcomes -->
  <g transform="translate(80, 280)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Consistent due-diligence coverage across every deal</text>
  </g>
  <g transform="translate(80, 334)">
    <rect width="440" height="44" fill="#fff" opacity="0.08" rx="8"/>
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.85">Faster time-to-decision on time-sensitive opportunities</text>
  </g>

  <!-- Company name -->
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff" opacity="0.9">RAPID INVESTMENT</text>

  <!-- Case study badge -->
  <rect x="620" y="390" width="120" height="35" fill="url(#rapid-accent)" rx="4"/>
  <text x="680" y="413" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#134e4a" text-anchor="middle">CASE STUDY</text>
</svg>
