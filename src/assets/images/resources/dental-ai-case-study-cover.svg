<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="dental-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="dental-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dental-bg)"/>

  <!-- Abstract tooth icon -->
  <g transform="translate(590, 80)" opacity="0.12">
    <path d="M60 0C20 0 0 25 0 55c0 25 10 45 18 65 6 15 8 30 12 30s10-25 14-45c3-15 8-15 12 0 4 20 10 45 14 45s6-15 12-30c8-20 18-40 18-65C160 25 100 0 60 0z" fill="#fff"/>
  </g>

  <!-- Patient communication visualization -->
  <g transform="translate(80, 100)">
    <g transform="translate(0, 0)">
      <rect width="260" height="45" fill="#fff" opacity="0.15" rx="8"/>
      <circle cx="28" cy="22" r="12" fill="#fff" opacity="0.3"/>
      <rect x="48" y="12" width="160" height="8" fill="#fff" opacity="0.4" rx="4"/>
      <rect x="48" y="26" width="120" height="6" fill="#fff" opacity="0.3" rx="3"/>
    </g>

    <g transform="translate(90, 65)">
      <rect width="300" height="70" fill="url(#dental-accent)" opacity="0.2" rx="8"/>
      <circle cx="30" cy="35" r="15" fill="url(#dental-accent)"/>
      <text x="30" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#172554" text-anchor="middle">AI</text>
      <rect x="55" y="20" width="210" height="8" fill="#fff" opacity="0.6" rx="4"/>
      <rect x="55" y="35" width="170" height="6" fill="#fff" opacity="0.4" rx="3"/>
      <rect x="55" y="48" width="190" height="6" fill="#fff" opacity="0.4" rx="3"/>
    </g>

    <g transform="translate(0, 155)">
      <rect width="240" height="45" fill="#fff" opacity="0.15" rx="8"/>
      <circle cx="28" cy="22" r="12" fill="#fff" opacity="0.3"/>
      <rect x="48" y="12" width="140" height="8" fill="#fff" opacity="0.4" rx="4"/>
      <rect x="48" y="26" width="100" height="6" fill="#fff" opacity="0.3" rx="3"/>
    </g>
  </g>

  <!-- Status chips -->
  <g transform="translate(500, 210)">
    <rect width="220" height="42" fill="#fff" opacity="0.1" rx="8"/>
    <text x="110" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">PRIVATE BETA</text>

    <g transform="translate(0, 52)">
      <rect width="220" height="42" fill="#fff" opacity="0.1" rx="8"/>
      <text x="110" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">HIPAA-COMPLIANT</text>
    </g>
  </g>

  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">DENTAL AI ASSISTANT</text>
  <text x="80" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#fff" opacity="0.7">Patient Communication &amp; Scheduling</text>

  <rect x="620" y="370" width="120" height="35" fill="url(#dental-accent)" rx="4"/>
  <text x="680" y="393" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#172554" text-anchor="middle">CASE STUDY</text>
</svg>
