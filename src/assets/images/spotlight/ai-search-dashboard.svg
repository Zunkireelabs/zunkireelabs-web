<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of an AI search dashboard with a search bar, ranked answers and a trend chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FAEC"/><stop offset="1" stop-color="#E8F1F8"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76B900" stop-opacity=".28"/><stop offset="1" stop-color="#76B900" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="60" y="48" width="680" height="404" rx="20" fill="#fff"/>
  </g>
  <path d="M60 100 V68 a20 20 0 0 1 20 -20 H720 a20 20 0 0 1 20 20 V100 Z" fill="#0F172A"/>
  <circle cx="88" cy="74" r="6" fill="#76B900"/><circle cx="108" cy="74" r="6" fill="#475569"/><circle cx="128" cy="74" r="6" fill="#475569"/>
  <text x="400" y="80" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff">AI Search</text>
  <rect x="92" y="126" width="616" height="44" rx="22" fill="#F1F5F9" stroke="#CBD5E1"/>
  <circle cx="120" cy="148" r="9" fill="none" stroke="#64748B" stroke-width="2.5"/><line x1="127" y1="155" x2="134" y2="162" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="148" y="154" font-family="Inter,Helvetica,Arial,sans-serif" font-size="15" fill="#64748B">Ask a question in plain language</text>
  <rect x="640" y="134" width="56" height="28" rx="14" fill="#76B900"/>
  <text x="668" y="153" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Search</text>
  <g font-family="Inter,Helvetica,Arial,sans-serif">
    <rect x="92" y="194" width="300" height="76" rx="12" fill="#fff" stroke="#E2E8F0"/>
    <text x="108" y="218" font-size="13" font-weight="600" fill="#0F172A">Best-matching answer</text>
    <rect x="108" y="230" width="250" height="8" rx="4" fill="#CBD5E1"/><rect x="108" y="246" width="190" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="92" y="282" width="300" height="76" rx="12" fill="#fff" stroke="#E2E8F0"/>
    <text x="108" y="306" font-size="13" font-weight="600" fill="#0F172A">Supporting source</text>
    <rect x="108" y="318" width="230" height="8" rx="4" fill="#CBD5E1"/><rect x="108" y="334" width="170" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="92" y="370" width="300" height="62" rx="12" fill="#fff" stroke="#E2E8F0"/>
    <text x="108" y="394" font-size="13" font-weight="600" fill="#0F172A">Related question</text>
    <rect x="108" y="406" width="200" height="8" rx="4" fill="#CBD5E1"/>
  </g>
  <rect x="412" y="194" width="296" height="238" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <text x="428" y="218" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0F172A">Search trend</text>
  <g stroke="#E2E8F0" stroke-width="1"><line x1="428" y1="250" x2="692" y2="250"/><line x1="428" y1="300" x2="692" y2="300"/><line x1="428" y1="350" x2="692" y2="350"/><line x1="428" y1="400" x2="692" y2="400"/></g>
  <path d="M428 392 L474 372 L520 380 L566 330 L612 316 L658 274 L692 262 L692 400 L428 400 Z" fill="url(#area)"/>
  <path d="M428 392 L474 372 L520 380 L566 330 L612 316 L658 274 L692 262" fill="none" stroke="#76B900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="692" cy="262" r="5" fill="#76B900"/>
</svg>
